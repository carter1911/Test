name = "ai-revenue-analyst"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Cloudflare Workers AI binding
[ai]
binding = "AI"

# HuggingFace API Secret Binding
# Set this secret using: wrangler secret put HUGGINGFACE_API_KEY
# Or via Cloudflare dashboard: Workers & Pages > Your Worker > Settings > Variables
[vars]
# Public variables (not sensitive)
APP_NAME = "AI Revenue & Operations Analyst"
APP_VERSION = "1.0.0"

# SECRETS (not declared in wrangler.toml):
# Secrets are set via CLI or Cloudflare Dashboard and accessed via env.HUGGINGFACE_API_KEY
# To set: wrangler secret put HUGGINGFACE_API_KEY
# Or: Cloudflare Dashboard > Workers > Settings > Variables > Add Variable (encrypted)
#
# Development environment variables: use .dev.vars file locally

# Optional: KV namespace for storing user data
# [[kv_namespaces]]
# binding = "ANALYTICS_KV"
# id = "your-kv-namespace-id"
# preview_id = "your-preview-kv-namespace-id"

# Optional: Durable Objects for real-time features
# [[durable_objects.bindings]]
# name = "ANALYTICS_DO"
# class_name = "AnalyticsSession"

[build]
command = "npm run build"

[observability]
enabled = true
